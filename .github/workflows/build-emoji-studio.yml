name: Build Emoji Studio installer (Windows)

on:
  push:
    tags: ["v*"]
    paths: ["emoji-studio/**", ".github/workflows/build-emoji-studio.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: emoji-studio

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Fetch ffmpeg (для WEBM)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff -Force
          $bin = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName ffmpeg\ffmpeg.exe -Force

      - name: Build EmojiStudio.exe
        run: >
          python -m PyInstaller --noconfirm --windowed --name EmojiStudio
          --icon installer\app.ico
          --add-data "web;web" --add-data "fonts;fonts" --add-data "ffmpeg;ffmpeg"
          app.py

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\EmojiStudio.iss

      - uses: actions/upload-artifact@v4
        with:
          name: EmojiStudio-Setup
          path: emoji-studio/installer_out/*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: emoji-studio/installer_out/*.exe
