name: build-harness-cloud-windows

on:
  workflow_dispatch:
  push:
    branches: ["harness-cloud"]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: harness-cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller scikit-image

      - name: Bundle Whisper models for offline use
        run: python -c "from faster_whisper import utils as u; [u.download_model(m, output_dir=f'models/whisper/{m}') for m in ('tiny', 'base')]"

      - name: "Fetch ffmpeg and ffprobe (Windows static build)"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, _ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile _ffmpeg/ffmpeg.zip
          Expand-Archive -Path _ffmpeg/ffmpeg.zip -DestinationPath _ffmpeg -Force
          $bin = Get-ChildItem -Path _ffmpeg -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe", "$($bin.FullName)\ffprobe.exe" -Destination bin
          & bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Build HarnessCloud.exe
        run: python -m PyInstaller --noconfirm harness-cloud.spec

      - name: "End-to-end test of the built exe"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:HARNESS_DATA_DIR = "$env:RUNNER_TEMP\hc_data"
          $env:PATH = "$PWD\bin;$env:PATH"
          $srv = Start-Process -FilePath "dist\HarnessCloud\HarnessCloud.exe" -ArgumentList "--server","--port","8765" -PassThru -WindowStyle Hidden
          try {
            $meta = $null
            for ($i = 0; $i -lt 60 -and -not $meta; $i++) {
              Start-Sleep -Seconds 2
              try { $meta = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/meta" -TimeoutSec 5 } catch {}
            }
            if (-not $meta) { Get-Content "$env:RUNNER_TEMP\hc_data\harness.log" -ErrorAction SilentlyContinue; throw "Сервер не ответил" }
            if ($meta.ffmpeg -like "ОШИБКА*") { throw "ffmpeg не найден: $($meta.ffmpeg)" }
            Write-Host "OK server: $($meta.name) $($meta.version), ffmpeg: $($meta.ffmpeg)"

            python scripts/ci_make_video.py "$env:RUNNER_TEMP\e2e"
            $video = "$env:RUNNER_TEMP\e2e\test.mp4"
            $resp = curl.exe -s -F "file=@$video" -F "content_type=general" -F "clip_count=5" -F "whisper_model=tiny" -F "subtitle_style=violet" -F "export_preset=tiktok" http://127.0.0.1:8765/api/projects/upload | ConvertFrom-Json
            $projId = $resp.ids[0]
            Write-Host "project: $projId"

            $deadline = (Get-Date).AddMinutes(40)
            do {
              Start-Sleep -Seconds 10
              $proj = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/projects/$projId"
            } while ($proj.status -in @("queued","running") -and (Get-Date) -lt $deadline)
            Write-Host "status=$($proj.status) stage=$($proj.stage)"
            Write-Host "warnings: $($proj.warnings -join ' | ')"
            if ($proj.status -ne "done") {
              Get-Content "$env:RUNNER_TEMP\hc_data\harness.log" -ErrorAction SilentlyContinue
              throw "E2E: проект не завершён: $($proj.error)"
            }
            $ready = @($proj.clips | Where-Object { $_.status -eq "done" -and $_.verify.ok })
            foreach ($c in $ready) {
              Write-Host ("clip {0}: {1}x{2} {3}s audio={4} score={5} face={6}/{7} hook='{8}'" -f $c.index, $c.verify.width, $c.verify.height, $c.verify.duration, $c.verify.has_audio, $c.score, $c.face.found, $c.face.samples, $c.hook)
            }
            if ($ready.Count -lt 5) { throw "E2E: готово проверенных клипов $($ready.Count), нужно минимум 5" }

            curl.exe -s -o "$env:RUNNER_TEMP\all.zip" "http://127.0.0.1:8765/api/projects/$projId/zip"
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $z = [System.IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP\all.zip")
            $names = @($z.Entries | ForEach-Object { $_.Name })
            $z.Dispose()
            Write-Host "zip: $($names -join ', ')"
            if (-not ($names -contains "metadata.json")) { throw "ZIP без metadata.json" }
            Write-Host "E2E OK: $($ready.Count) клипов 1080x1920, ZIP проверен"
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\HarnessCloud -DestinationPath HarnessCloud-windows.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item installer_out\HarnessCloud-Setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: HarnessCloud-windows
          path: harness-cloud/HarnessCloud-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HarnessCloud-Setup
          path: harness-cloud/installer_out/HarnessCloud-Setup.exe
